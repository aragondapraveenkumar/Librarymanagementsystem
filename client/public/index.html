<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VEMU Library System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --page-max-width: 1400px;
        --page-padding: 2rem;
        --panel-radius: 1.5rem;
        --dashboard-surface: rgba(9, 14, 36, 0.58);
        --dashboard-border: rgba(255,255,255,0.14);
        --dashboard-shadow: 0 22px 44px rgba(5, 10, 28, 0.28);
        --dashboard-highlight: rgba(255,255,255,0.08);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(145deg, #FF1B6B 0%, #3B7FFF 45%, #FF914D 100%);
        background-attachment: fixed;
        color: white;
        min-height: 100vh;
        line-height: 1.5;
      }
      button, input, select, textarea { font: inherit; }
      img { max-width: 100%; display: block; }
      .title-font {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 600;
        background: linear-gradient(135deg, #ffffff 0%, #e0e7ff 50%, #fbbf24 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .glass {
        background:
          radial-gradient(circle at top left, rgba(255,255,255,0.08), transparent 34%),
          linear-gradient(180deg, rgba(255,255,255,0.05), transparent 42%),
          var(--dashboard-surface);
        backdrop-filter: blur(20px);
        border: 1px solid var(--dashboard-border);
        box-shadow: var(--dashboard-shadow);
      }
      .glass-light { background: rgba(255,255,255,0.1); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.2); }
      .card-hover { transition: all 0.3s cubic-bezier(0.4,0,0.2,1); }
      .card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
      .btn-primary {
        background: linear-gradient(135deg, #FF6B6B, #FF914D);
        color: white; font-weight: 700; border-radius: 1rem;
        padding: 0.75rem 1.5rem; transition: all 0.2s; cursor: pointer; border: none;
      }
      .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
      .btn-ghost {
        background: rgba(255,255,255,0.15); color: white; font-weight: 600;
        border-radius: 1rem; padding: 0.75rem 1.5rem; transition: all 0.2s; cursor: pointer;
        border: 1px solid rgba(255,255,255,0.25);
      }
      .btn-ghost:hover { background: rgba(255,255,255,0.25); }
      .input-field {
        width: 100%; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25);
        border-radius: 0.875rem; padding: 0.875rem 1.25rem; color: white; outline: none;
        transition: all 0.2s; font-size: 0.9rem;
      }
      .input-field::placeholder { color: rgba(255,255,255,0.5); }
      .input-field:focus { border-color: rgba(99,102,241,0.6); box-shadow: 0 0 0 3px rgba(99,102,241,0.2); }
      .sidebar-btn { width:100%; text-align:left; display:flex; align-items:center; gap:0.75rem; padding:0.875rem 1.25rem; border-radius:0.875rem; background:transparent; border:none; color:white; font-weight:600; cursor:pointer; transition: all 0.2s; margin-bottom:4px; }
      .sidebar-btn:hover { background: rgba(255,255,255,0.15); transform: translateX(4px); }
      .sidebar-btn.active { background: rgba(99,102,241,0.3); border: 1px solid rgba(99,102,241,0.4); }
      ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius:10px; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius:10px; }
      .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; max-width: min(420px, calc(100vw - 2rem)); background: linear-gradient(135deg,#FF6B6B,#FF914D); color:white; padding: 0.875rem 1.5rem; border-radius: 1rem; font-weight:700; font-size:0.875rem; z-index:9999; animation: slideUp 0.3s ease; box-shadow: 0 20px 40px rgba(0,0,0,0.25); }
      @keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
      .book-card { background: rgba(255,255,255,0.12); backdrop-filter: blur(16px); border-radius:1.25rem; border:1px solid rgba(255,255,255,0.2); transition: all 0.3s; overflow:hidden; }
      .book-card:hover { transform: translateY(-6px); box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
      select option { background: #1e1a3a; color: white; }
      .page-shell { max-width: var(--page-max-width); margin: 0 auto; padding-left: var(--page-padding); padding-right: var(--page-padding); }
      .auth-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 6rem 1rem 2rem; }
      .auth-card { width: 100%; }
      .dashboard-shell { padding-top: 80px; }
      .dashboard-layout { display: flex; gap: 1.5rem; align-items: flex-start; }
      .dashboard-sidebar { width: 260px; flex-shrink: 0; }
      .dashboard-content { flex: 1; min-width: 0; }
      .dashboard-main-panel {
        border-radius: 1.75rem;
        padding: 1.85rem;
        min-height: 60vh;
        background:
          radial-gradient(circle at top right, rgba(255,255,255,0.08), transparent 26%),
          linear-gradient(180deg, rgba(11,17,43,0.74), rgba(7,12,31,0.58));
      }
      .dashboard-header-card {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 1rem;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
      }
      .dashboard-eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.35rem 0.8rem;
        border-radius: 999px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.14);
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #ffe29a;
      }
      .dashboard-user-chip {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.55rem 1rem;
        border-radius: 999px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.16);
      }
      .dashboard-stat-card {
        position: relative;
        overflow: hidden;
        border-radius: 1.35rem;
        padding: 1.35rem;
        background:
          linear-gradient(180deg, rgba(255,255,255,0.08), transparent 58%),
          rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.12);
      }
      .dashboard-stat-card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent 45%);
        pointer-events: none;
      }
      .dashboard-stat-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1rem;
      }
      .dashboard-icon-badge {
        width: 3rem;
        height: 3rem;
        border-radius: 1rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.15);
        font-size: 1.3rem;
      }
      .section-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin-bottom: 1rem;
      }
      .section-subtle {
        color: rgba(255,255,255,0.68);
        font-size: 0.88rem;
      }
      .empty-panel {
        padding: 3rem 1.5rem;
        text-align: center;
        border-radius: 1.25rem;
        background: rgba(255,255,255,0.04);
        border: 1px dashed rgba(255,255,255,0.14);
        color: rgba(255,255,255,0.68);
      }
      .soft-panel {
        border-radius: 1.25rem;
        padding: 1.25rem;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.1);
      }
      .section-grid-auto { display: grid; grid-template-columns: repeat(auto-fit,minmax(200px,1fr)); gap: 1.25rem; }
      .card-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(170px,1fr)); gap: 1rem; }
      .wide-card-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(160px,1fr)); gap: 1rem; }
      .split-layout { display: grid; grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); gap: 1.5rem; align-items: start; }
      .stack-grid { display: grid; gap: 1rem; }
      .search-bar { display: flex; gap: 0.75rem; align-items: stretch; }
      .issue-notice { margin-bottom: 1rem; padding: 1rem; border-radius: 1rem; background: linear-gradient(135deg, rgba(34,197,94,0.26), rgba(13,148,136,0.22)); border: 1px solid rgba(134,239,172,0.35); }
      .home-top-links { display: flex; align-items: center; gap: 1.25rem; justify-content: flex-end; padding-top: 6rem; padding-bottom: 1rem; }
      .home-hero { min-height: calc(100vh - 7rem); display: flex; align-items: center; justify-content: center; }
      .book-card-shell {
        display: flex;
        flex-direction: column;
        min-height: 100%;
        background:
          radial-gradient(circle at top left, rgba(255,255,255,0.08), transparent 38%),
          linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015)),
          rgba(9, 14, 34, 0.58);
        border: 1px solid rgba(255,255,255,0.14);
        box-shadow: 0 18px 34px rgba(7, 11, 28, 0.18);
      }
      .book-card-media {
        padding: 1.35rem 1rem 1rem;
        text-align: center;
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }
      .book-card-body {
        display: flex;
        flex: 1;
        flex-direction: column;
        justify-content: space-between;
        padding: 0.95rem;
        gap: 0.85rem;
      }
      .issued-card {
        border-radius: 1.35rem;
        padding: 1.35rem;
        margin-bottom: 1rem;
        background:
          linear-gradient(180deg, rgba(255,255,255,0.06), transparent 40%),
          rgba(255,255,255,0.035);
        border: 1px solid rgba(255,255,255,0.11);
      }
      .issued-meta-grid {
        display: grid;
        grid-template-columns: repeat(3,minmax(0,1fr));
        gap: 1rem;
        border-top: 1px solid rgba(255,255,255,0.1);
        padding-top: 1rem;
      }
      @media (max-width: 1024px) {
        .dashboard-layout { flex-direction: column; }
        .dashboard-sidebar { width: 100%; }
        .split-layout { grid-template-columns: 1fr; }
      }
      @media (max-width: 768px) {
        :root { --page-padding: 1rem; }
        .search-bar { flex-direction: column; }
        .home-top-links { justify-content: center; padding-top: 5.75rem; }
        .toast { right: 1rem; bottom: 1rem; }
        .issued-meta-grid { grid-template-columns: 1fr; }
        .dashboard-main-panel { padding: 1.15rem; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
